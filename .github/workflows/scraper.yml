name: Scraper Volantini Settimanale

on:
  # Parte ogni lunedì alle 07:00 ora italiana (06:00 UTC)
  schedule:
    - cron: '0 6 * * 1'

  # Permette di avviarlo manualmente dal sito GitHub con un click
  workflow_dispatch:

jobs:
  scrapa-offerte:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # necessario per salvare offerte.json nel repo

    steps:
      # 1. Scarica il contenuto del tuo repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Installa Python (già disponibile su GitHub Actions)
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Esegui lo scraper
      - name: Esegui scraper
        run: python scraper.py

      # 4. Salva il file offerte.json aggiornato nel repository
      - name: Commit offerte aggiornate
        run: |
          git config user.name  "Scraper Bot"
          git config user.email "scraper@noreply.github.com"
          git add offerte.json
          git diff --staged --quiet || git commit -m "🛒 Offerte aggiornate $(date +'%d/%m/%Y')"
          git push
